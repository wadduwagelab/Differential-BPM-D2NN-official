# Classification sweep. One run per (dataset, encoding); loops over n and seeds.
#   python scripts/run_classification_sweep.py --dataset mnist --encoding phase --out_dir experiments/cls/mnist_phase
task: classification
datasets: [mnist, fmnist]
encodings: [phase, amplitude]
wavelength_m: 532e-9
grid: 200                 # simulation grid (pixels); aperture = 107 lambda -> pixel pitch 0.535 lambda
digit: 112                # input image size (pixels) after resizing, zero padded to the grid
aperture_lam: 107.0
z_lam: 40.0               # inter-layer spacing and layer-to-detector distance (in wavelengths)
L: 5                      # number of diffractive layers
n_values: [1.1, 1.2, 1.3, 1.4, 1.5, 1.7, 1.9]
seeds: [0, 1, 2]
epochs: 10
ft_epochs: 5              # volumetric fine-tuning epochs started from the thin-trained solution
batch: 128
lr: 1.0e-3
optimizer: adam
phase_param: wrap         # phi = mod(2 pi beta, 2 pi)
discretisation:
  train_n_sub: "max(15, ceil(3 * h_max / lambda))"   # dz <= lambda/3 during training
  eval_n_sub:  "max(train_n_sub, ceil(12 * h_max / lambda))"  # dz <= lambda/12 for all reported numbers
  sigmoid_temp: 0.05 * dz                              # annealed during volumetric training (see dbpm_d2nn/train.py)
axial_convention:
  volumetric_layers: centroid          # relief centroid coincides with the nominal layer plane
  also_reported: [entrance]            # entrance face of the slab at the nominal plane
data_split:
  train_val: "torchvision train set, 5000 images held out for validation (split_seed 0)"
  test: "torchvision test set (10,000 images)"
calibration_controls:                  # fitted on a fixed 2000-image validation subset, evaluated on the full test set
  axial_shift: "[-h_max, +h_max], single global delta_z shared by all layers; 11-point coarse grid + 7-point refinement"
  height_scale: "[0.5, 1.5], single global s in h = s * lambda * phi / (2 pi delta_n); same grid search"
  joint: "2 rounds of coordinate descent over (s, delta_z)"
fabrication_metrics: true              # slope, wrap-edge fraction, aspect ratio for every trained height map
